name: Theme checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit all themes and refresh report
        run: python3 scripts/check_contrast.py --report docs/contrast-report.md
      - name: Require the committed report to match the theme
        run: git diff --exit-code -- docs/contrast-report.md
